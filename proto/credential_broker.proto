syntax = "proto3";

package openshell.credential_broker.v1;

import "extension.proto";

// CredentialBroker decides the credential for each inspected HTTP request a
// sandbox sends to a host the operator selects. The gateway calls Describe at
// startup. Sandbox supervisors call GrantHttpRequest on the request path.
//
// Every supervisor call has a gateway-signed extension bearer token with
// `caller_kind` = "supervisor" and the calling `sandbox_id`. Authorize on the
// token's claims. Request fields are for audit only.
service CredentialBroker {
  // Describe resolves compatibility between the gateway and the broker:
  // protocol metadata and the extension token audience. The gateway calls it
  // once at startup and does not start when the check fails.
  rpc Describe(BrokerDescribeRequest) returns (BrokerManifest);

  // GrantHttpRequest decides the credential for one inspected HTTP request.
  // A gRPC error fails the request with HTTP 502. A decision is never retried.
  rpc GrantHttpRequest(HttpCredentialRequest) returns (HttpCredentialResult);
}

message BrokerDescribeRequest {
  // Gateway protocol metadata.
  openshell.extension.v1.PeerMetadata gateway = 1;
}

message BrokerManifest {
  // Implementation name for diagnostics.
  string name = 1;
  // The `aud` the broker accepts on OpenShell extension tokens. The gateway
  // does not start when it differs from the registration's audience. Empty
  // skips the check. It does not limit which upstream resources the broker
  // grants credentials for.
  string expected_audience = 2;
  // Broker protocol metadata. Required.
  openshell.extension.v1.PeerMetadata extension = 3;
}

message HttpCredentialRequest {
  // Identifies the request in the workload response and supervisor logs.
  string request_id = 1;
  // Calling sandbox, for audit. Authorize on the extension token instead.
  string sandbox_id = 2;
  // HTTP method.
  string method = 3;
  // "https", or "http" for a plaintext request.
  string scheme = 4;
  // Destination host, lowercase, without brackets for IPv6.
  string host = 5;
  // Destination port.
  uint32 port = 6;
  // Request path without the query string.
  string path = 7;
}

message HttpCredentialResult {
  // Exactly one decision is required. A missing decision fails the request.
  oneof decision {
    CredentialGrant grant = 1;
    CredentialPass pass = 2;
    CredentialDeny deny = 3;
  }
}

// Replace request credentials before the request goes upstream. Provider
// credentials for other targets still apply. A grant for an "http" request
// fails it, so OpenShell never sends a broker credential in cleartext.
message CredentialGrant {
  // One to 8 placements. Each header or query parameter appears at most once.
  repeated CredentialPlacement placements = 1;
}

// One credential and where it goes. auth_style, header_name, and query_param
// mean what they mean on a provider profile credential. The placement
// replaces every instance of the header or query parameter it writes.
message CredentialPlacement {
  // "bearer", "basic", "header", or "query".
  string auth_style = 1;
  // Header written by bearer, basic, and header. Required when auth_style is
  // header. Bearer and basic default to Authorization when it is empty. Must
  // be empty when auth_style is query. Routing, framing, hop-by-hop,
  // Connection-nominated, and x-openshell-* headers are refused.
  string header_name = 2;
  // Query parameter written by query. Required when auth_style is query, and
  // must be empty otherwise.
  string query_param = 3;
  // The credential, at most 8 KiB, without control characters. Bearer sends
  // "Bearer <value>". Basic sends "Basic <base64(value)>", where value is
  // "user:password". Header and query send the value unchanged.
  string value = 4;
}

// Send the request without a broker credential. Provider credentials apply.
message CredentialPass {}

// Refuse the request with HTTP 403.
message CredentialDeny {
  DenyReason reason = 1;
}

enum DenyReason {
  // Treated as DENY_REASON_ACCESS_DENIED.
  DENY_REASON_UNSPECIFIED = 0;
  // Policy refuses the sandbox access to the resource.
  DENY_REASON_ACCESS_DENIED = 1;
  // A user must authorize the resource first.
  DENY_REASON_AUTHORIZATION_REQUIRED = 2;
}
