<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="535" viewBox="0 0 1220 535" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell extension points</title>
  <desc id="desc">Two rows read left to right. Data plane: the sandboxed agent reaches the supervisor through the isolation backend, and supervisor middleware processes requests before they reach models and APIs. The supervisor gets per-request tokens from an authorization server through a delegated credential grant. Control plane: you reach the gateway through interceptors, and gateway drivers connect it to runtimes and secret stores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#579000"/>
    </marker>
    <style>
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: .08em; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tag { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #579000; letter-spacing: .06em; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .trusted { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; }
      .extension { fill: #f2f9e8; stroke: #76b900; stroke-width: 2.5; }
      .dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .flow { fill: none; stroke: #579000; stroke-width: 3; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1220" height="535" rx="20" fill="#ffffff"/>

  <text x="30" y="41" class="section">DATA PLANE</text>
  <rect x="500" y="30" width="220" height="90" rx="15" class="extension"/>
  <text x="610.0" y="56" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="610.0" y="83" text-anchor="middle" class="label">Authorization server</text>
  <text x="610.0" y="105" text-anchor="middle" class="small">per-request tokens</text>
  <rect x="30" y="210" width="180" height="90" rx="14" class="dark"/>
  <text x="120.0" y="252" text-anchor="middle" class="label" style="fill:#fff">Agent</text>
  <text x="120.0" y="276" text-anchor="middle" class="small" style="fill:#d1d5db">sandboxed workload</text>
  <rect x="250" y="210" width="200" height="90" rx="15" class="extension"/>
  <text x="350.0" y="236" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="350.0" y="263" text-anchor="middle" class="label">Isolation backend</text>
  <text x="350.0" y="285" text-anchor="middle" class="small">launch · exec · mediate</text>
  <rect x="490" y="195" width="430" height="120" rx="18" class="trusted"/>
  <text x="510" y="252" class="label">Supervisor</text>
  <text x="510" y="276" class="small">policy · credentials</text>
  <rect x="690" y="210" width="210" height="90" rx="15" class="extension"/>
  <text x="795.0" y="236" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="795.0" y="263" text-anchor="middle" class="label">Middleware</text>
  <text x="795.0" y="285" text-anchor="middle" class="small">inspect · transform · deny</text>
  <rect x="970" y="210" width="220" height="90" rx="14" class="box"/>
  <text x="1080.0" y="252" text-anchor="middle" class="label">Models, APIs</text>
  <text x="1080.0" y="276" text-anchor="middle" class="small">external services</text>
  <path d="M210 255 H248" class="line"/>
  <path d="M450 255 H488" class="line"/>
  <path d="M650 255 H688" class="line"/>
  <path d="M900 255 H968" class="flow"/>
  <path d="M610 122 V193" class="line both"/>

  <text x="30" y="371" class="section">CONTROL PLANE</text>
  <rect x="30" y="400" width="180" height="90" rx="14" class="box"/>
  <text x="120.0" y="442" text-anchor="middle" class="label">You</text>
  <text x="120.0" y="466" text-anchor="middle" class="small">CLI · SDK · TUI</text>
  <rect x="250" y="400" width="200" height="90" rx="15" class="extension"/>
  <text x="350.0" y="426" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="350.0" y="453" text-anchor="middle" class="label">Interceptors</text>
  <text x="350.0" y="475" text-anchor="middle" class="small">modify · validate · observe</text>
  <rect x="490" y="385" width="430" height="120" rx="18" class="trusted"/>
  <text x="510" y="442" class="label">Gateway</text>
  <text x="510" y="466" class="small">auth · state · API</text>
  <rect x="690" y="400" width="210" height="90" rx="15" class="extension"/>
  <text x="795.0" y="426" text-anchor="middle" class="tag">EXTENSION POINT</text>
  <text x="795.0" y="453" text-anchor="middle" class="label">Drivers</text>
  <text x="795.0" y="475" text-anchor="middle" class="small">compute · credentials</text>
  <rect x="970" y="400" width="220" height="90" rx="14" class="box"/>
  <text x="1080.0" y="442" text-anchor="middle" class="label">Infrastructure</text>
  <text x="1080.0" y="466" text-anchor="middle" class="small">runtimes · secret stores</text>
  <path d="M210 445 H248" class="line"/>
  <path d="M450 445 H488" class="line"/>
  <path d="M650 445 H688" class="line"/>
  <path d="M900 445 H968" class="line"/>
</svg>
